
name = "tldraw-worker"
main = "worker/worker.ts"
compatibility_date = "2025-05-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[assets]
not_found_handling = "single-page-application"
directory = "./dist/client"

[observability]
enabled = true

# Set up the durable object used for each tldraw room
[durable_objects]
bindings = [
    { name = "TLDRAW_DURABLE_OBJECT", class_name = "TldrawDurableObjectSqlite" },
]

# Durable objects require migrations to create/modify/delete them
[[migrations]]
tag = "v1"
new_classes = ["TldrawDurableObject"]

# v2 was a no-op: classes_with_sqlite is not a valid Cloudflare migration directive
[[migrations]]
tag = "v2"

# New SQLite-backed class to replace KV-backed TldrawDurableObject
[[migrations]]
tag = "v3"
deleted_classes = ["TldrawDurableObject"]
new_sqlite_classes = ["TldrawDurableObjectSqlite"]

# We store asset uploads in an R2 bucket.
[[r2_buckets]]
binding = 'TLDRAW_BUCKET'
bucket_name = 'tldraw-content'
preview_bucket_name = 'tldraw-content-preview'
